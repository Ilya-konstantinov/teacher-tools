name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: colloq_tickets/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r colloq_tickets/requirements.txt
      - name: Test scheduling
        working-directory: colloq_time
        run: python main.py test
      - name: Test ticket generation and TeX export
        working-directory: colloq_tickets
        run: python main.py test
